<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みんなの森 — 教室提示</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="child-ui.css">
<style>body{margin:0;background:#f8f6ec}#presentation{height:100dvh;display:flex;flex-direction:column;gap:12px;padding:18px;background:#f8f6ec}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:clamp(22px,3vw,40px);margin:0}.join{font-size:18px;text-align:right}.join strong{display:block;font-size:clamp(26px,4vw,54px);letter-spacing:.1em}.forest-viewport{position:relative;flex:1;min-height:200px;overflow:hidden;touch-action:none}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:10px 16px;border:1px solid #bdcaaa;border-radius:12px;background:#fffef7;font:inherit;color:#34543a;cursor:pointer}#progressLabel{font-size:20px;flex:1}#status{font-size:14px;color:#65745b}.garden-flower{width:180px;height:180px}#presentation:fullscreen{width:100vw;height:100vh}.join small{font-size:14px}</style>
<main id="presentation"><header><div><h1>みんなの「できた！」が、森になる。</h1><div id="status" role="status">先生画面でクラスを開いてください</div></div><div class="join">参加するクラスコード<strong id="classCode">——</strong><small>児童画面の「クラスに はいる」へ</small></div></header><div id="forestViewport" class="forest-viewport"><div id="forestWorld" class="forest-world"><div id="layerTerrain" class="forest-layer forest-layer--terrain"></div><div id="layerAssets" class="forest-layer forest-layer--assets"></div><div id="layerAnimals" class="forest-layer forest-layer--animals"></div></div></div><div class="tools"><span id="progressLabel">クラスの接続を待っています</span><button id="zoomOut" aria-label="縮小">−</button><button id="zoomIn" aria-label="拡大">＋</button><button id="fit">森全体</button><button id="fullscreen">全画面で映す</button></div></main><script type="module" src="js/class-forest.js"></script></html>
