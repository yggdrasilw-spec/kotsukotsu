<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>コツコツの森 — 広がる森の試作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3e8;color:#405139;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;padding:20px;gap:12px;max-width:1600px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:23px;margin:0}p{margin:5px 0;font-size:13px;color:#71806a}button{font:inherit;color:inherit;background:#fffdf5;border:1px solid #d5dcc7;border-radius:12px;padding:11px 17px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #527b43;outline-offset:3px}button.primary{background:#466d42;color:white;border-color:#466d42}button:disabled{opacity:.45;cursor:default}.view{position:relative;flex:1;min-height:220px;border-radius:24px;overflow:hidden;background:#f0f0df;box-shadow:0 6px 28px #4b66351a}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.caption{position:absolute;left:20px;top:18px;background:#fffdf1e8;padding:12px 17px;border-radius:14px;pointer-events:none}.caption strong{font-size:16px}.caption p{font-size:12px}.zoom{position:absolute;right:16px;bottom:16px;display:flex;gap:6px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls label{display:flex;gap:10px;align-items:center;font-size:14px}input{accent-color:#567c47;width:160px}#status{font-size:14px;flex:1;min-width:200px}small{font-size:12px;color:#78836f}@media(max-width:600px){main{padding:10px}header{align-items:start}h1{font-size:18px}.controls{gap:8px}.caption{left:12px;top:12px}.controls button{padding:10px}small{display:none}}
</style>
<main>
<header><div><h1>コツコツの森</h1><p>ひとつの森が、すこしずつ広がる。</p></div><button id="reset">はじめから</button></header>
<div class="view"><canvas id="forest" aria-label="ドラッグで移動、ピンチまたはホイールで拡大縮小できる森。下のボタンで成長を試せます。"></canvas><div class="caption"><strong id="stage">はじめの小さな広場</strong><p>シンボルツリーが、森のまんなか。</p></div><div class="zoom"><button id="out" aria-label="縮小">−</button><button id="in" aria-label="拡大">＋</button><button id="home">木のところへ</button><button id="fit">森全体</button></div></div>
<div class="controls"><button id="grow" class="primary">みんなの「できた！」をためる</button><label>広がり <input id="progress" type="range" min="0" max="100" value="0" aria-label="森の広がりを試す"></label><span id="status" role="status">小さな広場から、はじまります。</span></div>
<small>絵と動きの試作です。実際の記録には影響しません。ドラッグで移動・ホイール／ピンチで拡大縮小。</small>
</main>
<script type="module" src="js/forest-expansion-preview.js"></script>
</html>
